<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Book Appointment | NRS-MediSys</title>
  <link rel="stylesheet" href="appointment.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">NRS-MediSys</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="#">Doctors</a></li>
      <li><a href="#">Patients</a></li>
      <li><a href="#">Contact</a></li>
      <li><a href="#" class="btn">Login / Signup</a></li>
    </ul>
  </nav>

  <!-- Appointment Section -->
  <section class="appointment-section">
    <h1>Book an Appointment</h1>
    <p>Fill the form below to schedule your doctor appointment</p>

    <div class="appointment-card">
      <form id="appointmentForm">

        <div class="form-group">
          <label>Patient Name</label>
          <input type="text" required placeholder="Enter full name">
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" required placeholder="example@email.com">
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" required placeholder="98XXXXXXXX">
        </div>

        <div class="form-group">
          <label>Select Department</label>
          <select required>
            <option value="">-- Choose Department --</option>
            <option>General Medicine</option>
            <option>Cardiology</option>
            <option>Orthopedics</option>
            <option>Neurology</option>
            <option>Pediatrics</option>
          </select>
        </div>

        <div class="form-group">
          <label>Select Doctor</label>
          <select required>
            <option value="">-- Choose Doctor --</option>
            <option>Dr. Ram Shrestha</option>
            <option>Dr. Sita Karki</option>
            <option>Dr. Anil Thapa</option>
          </select>
        </div>

        <div class="form-group">
          <label>Appointment Date</label>
          <input type="date" required>
        </div>

        <div class="form-group">
          <label>Appointment Time</label>
          <input type="time" required>
        </div>

        <div class="form-group">
          <label>Problem Description</label>
          <textarea rows="4" placeholder="Describe your health issue"></textarea>
        </div>

        <button type="submit" class="submit-btn">
          Confirm Appointment
        </button>

      </form>
    </div>
  </section>

  <script src="appointment.js"></script>
</body>
</html>


<style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  background: #f4f9fc;
}

/* Navbar */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 60px;
  background: #ffffff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.logo {
  font-size: 22px;
  font-weight: 700;
  color: #00b894;
}

.nav-links {
  list-style: none;
  display: flex;
  gap: 25px;
}

.nav-links a {
  text-decoration: none;
  color: #333;
  font-weight: 500;
}

.nav-links .btn {
  padding: 8px 14px;
  border: 1px solid #00b894;
  border-radius: 6px;
  color: #00b894;
}

/* Appointment Section */
.appointment-section {
  padding: 60px 20px;
  text-align: center;
}

.appointment-section h1 {
  font-size: 36px;
  margin-bottom: 10px;
  color: #2d3436;
}

.appointment-section p {
  color: #636e72;
  margin-bottom: 40px;
}

/* Card */
.appointment-card {
  max-width: 650px;
  margin: auto;
  background: #fff;
  padding: 35px;
  border-radius: 12px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.08);
}

/* Form */
.form-group {
  margin-bottom: 18px;
  text-align: left;
}

.form-group label {
  display: block;
  margin-bottom: 6px;
  font-weight: 600;
  color: #2d3436;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 12px;
  border-radius: 6px;
  border: 1px solid #dfe6e9;
  outline: none;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  border-color: #00b894;
}

/* Button */
.submit-btn {
  width: 100%;
  padding: 14px;
  background: #00b894;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s;
}

.submit-btn:hover {
  background: #019874;
}

</style>


<script>
    document.getElementById("appointmentForm").addEventListener("submit", function(e) {
  e.preventDefault();
  alert("✅ Appointment booked successfully!");
  this.reset();
});

</script>
