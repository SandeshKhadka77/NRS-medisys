<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login/Register - NRS-mediSys</title>
   <link rel="stylesheet" href="CSS/main.css" />
  <body>

<!--Navbar -->
<div class="navbar">
  <div class="logo">NRS-<span>MediSys</span></div>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="doctors.html">Doctors</a></li>
      <li><a href="patients.html">Patients</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="notice.html">Notices</a></li>
    </ul>
  </nav>
  <a href="login.html" class="btn">Login / Signup</a>
</div>


  <div class="container">
    
    <!-- Login Form -->
    <div id="loginBox" class="form-box active">
      <h2>Login</h2>
      <div class="form-group">
        <label>Email or Phone</label>
        <input type="text" placeholder="Enter your email or phone">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="Enter your password">
      </div>
      <button>Login</button>
      <div class="link-text">
        <a href="#" onclick="showForm('forgotBox')">Forgot Password?</a><br>
        Don't have an account? <a href="#" onclick="showForm('registerBox')">Register</a>
      </div>
    </div>

    <!-- Register Form -->
    <div id="registerBox" class="form-box">
      <h2>Register</h2>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" placeholder="Enter your name">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="Enter your email">
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" placeholder="Enter your phone number">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="Create a password">
      </div>
      <button>Register</button>
      <div class="link-text">
        Already have an account? <a href="#" onclick="showForm('loginBox')">Login</a>
      </div>
    </div>

    <!-- Forgot Password -->
    <div id="forgotBox" class="form-box">
      <h2>Forgot Password</h2>
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="Enter your email">
      </div>
      <button>Send Reset Link</button>
      <div class="link-text">
        Remembered your password? <a href="#" onclick="showForm('loginBox')">Back to Login</a>
      </div>
    </div>

  </div>
</head>

<!--  JS forms -->
  <script>
    function showForm(formId) {
      // Hide all forms
      document.getElementById("loginBox").classList.remove("active");
      document.getElementById("registerBox").classList.remove("active");
      document.getElementById("forgotBox").classList.remove("active");

      // Show selected form
      document.getElementById(formId).classList.add("active");
    }
  </script>

</body>
</html>
